<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 707" width="500" height="707" role="img" aria-label="Placeholder cover">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="60%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.35" />
    </filter>

    <pattern id="diag" patternUnits="userSpaceOnUse" width="18" height="18" patternTransform="rotate(25)">
      <rect width="18" height="18" fill="transparent" />
      <path d="M0 18 L18 0" stroke="rgba(255,255,255,0.02)" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" rx="14" ry="14" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="14" ry="14" fill="url(#diag)" opacity="0.25" />

  <!-- 卡片内阴影和书本主体 -->
  <g transform="translate(60,60)" filter="url(#shadow)">
    <!-- 书本主体背景 -->
    <rect x="0" y="0" width="380" height="560" rx="12" ry="12" fill="#0f1724" opacity="0.85"/>

    <!-- 书封装饰渐变条 -->
    <rect x="18" y="18" width="344" height="200" rx="8" fill="url(#accent)" />

    <!-- 书页效果 -->
    <g transform="translate(36,240)">
      <rect x="0" y="0" width="320" height="260" rx="6" fill="#0b1220" />
      <!-- page lines -->
      <g stroke="rgba(255,255,255,0.03)" stroke-width="2">
        <path d="M12 28 L308 28" />
        <path d="M12 56 L300 56" />
        <path d="M12 84 L308 84" />
        <path d="M12 112 L296 112" />
        <path d="M12 140 L308 140" />
        <path d="M12 168 L300 168" />
        <path d="M12 196 L308 196" />
      </g>
    </g>

    <!-- 书脊线条（轻微凸起） -->
    <rect x="0" y="0" width="12" height="560" rx="6" fill="rgba(255,255,255,0.02)" />

    <!-- 中央图标：简化的书本轮廓 -->
    <g transform="translate(140,64)">
      <rect x="0" y="0" width="100" height="140" rx="6" fill="#0b1220" stroke="rgba(255,255,255,0.06)" />
      <rect x="6" y="8" width="30" height="124" rx="3" fill="rgba(255,255,255,0.03)" />
      <path d="M44 12 L94 12 L94 132 L44 132 Z" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.025)"/>
      <g transform="translate(10,20)" fill="rgba(255,255,255,0.06)">
        <rect x="0" y="12" width="72" height="8" rx="3" />
        <rect x="0" y="32" width="62" height="8" rx="3" />
        <rect x="0" y="52" width="68" height="8" rx="3" />
      </g>
    </g>

    <!-- 右上警示徽章 -->
    <g transform="translate(320,12)">
      <circle cx="28" cy="28" r="28" fill="#ef4444" />
      <text x="28" y="36" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="30" text-anchor="middle" fill="white">!</text>
    </g>
  </g>

  <!-- 底部文字说明 -->
  <g transform="translate(0,630)">
    <text x="250" y="18" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e5e7eb">封面加载失败</text>
    <text x="250" y="38" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9ca3af">Cover failed to load</text>
  </g>

  <!-- 小提示线 -->
  <rect x="0" y="0" width="500" height="707" rx="14" ry="14" fill="none" stroke="rgba(255,255,255,0.03)"/>
</svg>