name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.6.10.1)'
        required: true
        type: string
      package_manager:
        description: 'Package manager to use (npm, yarn, pnpm)'
        required: false
        default: 'yarn'
        type: choice
        options:
        - npm
        - yarn
        - pnpm

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    env:
      PACKAGE_MANAGER: ${{ inputs.package_manager || 'yarn' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ env.PACKAGE_MANAGER }}
          
      - name: Install dependencies
        run: |
          if [ "${{ env.PACKAGE_MANAGER }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ env.PACKAGE_MANAGER }}" = "pnpm" ]; then
            npm install -g pnpm
            pnpm install --frozen-lockfile
          else
            npm ci
          fi
        
      - name: Create secret_key.json for build
        shell: powershell
        run: |
          Copy-Item "secret_key.json.template" "secret_key.json"
          Write-Host "Created secret_key.json from template"
        
      - name: Build frontend
        run: |
          if [ "${{ env.PACKAGE_MANAGER }}" = "yarn" ]; then
            yarn build
          elif [ "${{ env.PACKAGE_MANAGER }}" = "pnpm" ]; then
            pnpm build
          else
            npm run build
          fi
        
      - name: Build Electron app (Windows)
        run: |
          if [ "${{ env.PACKAGE_MANAGER }}" = "yarn" ]; then
            yarn dist
          elif [ "${{ env.PACKAGE_MANAGER }}" = "pnpm" ]; then
            pnpm dist
          else
            npm run dist
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 使用预编译的二进制文件，避免从源码编译
          npm_config_build_from_source: false
          
      - name: Create portable package
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}" -replace '^v', ''
          }
          
          # 查找构建输出目录
          $buildDir = Get-ChildItem -Path "out" -Directory -Filter "win-unpacked" -Recurse | Select-Object -First 1
          
          if ($buildDir) {
            $packageName = "exhentai-manga-manager-$version-win-x64-portable.zip"
            
            # 压缩为zip
            Compress-Archive -Path "$($buildDir.FullName)\*" -DestinationPath "out\$packageName" -CompressionLevel Optimal
            
            Write-Host "Created portable package: $packageName"
            # 使用正斜杠以兼容GitHub Actions
            echo "PACKAGE_PATH=out/$packageName" >> $env:GITHUB_ENV
            echo "PACKAGE_NAME=$packageName" >> $env:GITHUB_ENV
          } else {
            Write-Error "Build directory not found"
            exit 1
          }
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: ${{ env.PACKAGE_PATH }}
          retention-days: 5
          
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.PACKAGE_PATH }}
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          generate_release_notes: true
          body: |
            ## 📦 下载说明
            
            下载 `${{ env.PACKAGE_NAME }}` 解压后直接运行 `exhentai-manga-manager.exe`
            
            ### Windows 便携版
            - 无需安装，解压即用
            - 所有数据保存在程序目录
            - 适合移动存储设备使用
            
            ## 🔄 更新内容
            
            详见自动生成的更新日志
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Trigger Extras-Glow workflow
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}" -replace '^v', ''
          }
          
          Write-Host "New EMM version released: $version"
          Write-Host "To trigger Extras-Glow workflow manually, go to:"
          Write-Host "https://github.com/HibernalGlow/Extras-Glow/actions/workflows/schedule.yml"
          Write-Host "And dispatch workflow with the following inputs:"
          Write-Host "event_type: emm-release"
          Write-Host "version: $version"
          Write-Host "repository: ${{ github.repository }}"
          Write-Host "ref: ${{ github.ref }}"
          Write-Host "sha: ${{ github.sha }}"
          
          # 如果配置了token，尝试自动触发
          if ($env:extrasglow) {
            $body = @{
              event_type = "emm-release"
              client_payload = @{
                version = $version
                repository = "${{ github.repository }}"
                ref = "${{ github.ref }}"
                sha = "${{ github.sha }}"
              }
            } | ConvertTo-Json
            
            $headers = @{
              "Authorization" = "Bearer ${{ secrets.extrasglow }}"
              "Accept" = "application/vnd.github.v3+json"
            }
            
            try {
              Invoke-RestMethod -Uri "https://api.github.com/repos/HibernalGlow/Extras-Glow/dispatches" -Method Post -Headers $headers -Body $body -ContentType "application/json"
              Write-Host "✅ Successfully triggered Extras-Glow workflow automatically"
            } catch {
              Write-Host "⚠️  Auto-trigger failed, manual trigger required: $($_.Exception.Message)"
              Write-Host "📋 Copy the information above to manually trigger the workflow"
            }
          } else {
            Write-Host "ℹ️  No extrasglow configured, manual trigger required"
          }
          
      - name: Upload to workflow dispatch release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          files: ${{ env.PACKAGE_PATH }}
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📦 下载说明
            
            下载 `${{ env.PACKAGE_NAME }}` 解压后直接运行 `exhentai-manga-manager.exe`
            
            ### Windows 便携版
            - 无需安装，解压即用
            - 所有数据保存在程序目录
            - 适合移动存储设备使用
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
